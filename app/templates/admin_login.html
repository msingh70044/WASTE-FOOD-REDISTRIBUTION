{% extends 'base.html' %}

{% block title %}Admin Login - Share Bite{% endblock %}

{% block content %}
<style>
.login-page {
    min-height: 80vh;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-content {
    max-width: 500px;
    width: 100%;
    background: white;
    border-radius: 15px;
    padding: 40px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
}

.login-content h2 {
    color: #4facfe;
    margin-bottom: 10px;
}

.login-content p {
    color: #666;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #333;
    font-weight: 600;
}

.form-input {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 0.95rem;
    transition: all 0.3s ease;
}

.form-input:focus {
    outline: none;
    border-color: #4facfe;
    box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
}

.primary-button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 1rem;
}

.primary-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(79, 172, 254, 0.3);
}
</style>

<div class="login-page">
    <div class="login-content">
        <h2>📊 Admin Login</h2>
        <p>Access the admin dashboard to review donations, food orders, and donor activity.</p>
        <form method="post">
            <div class="form-group">
                <label for="admin_id">🆔 Admin ID</label>
                <input type="text" id="admin_id" name="admin_id" class="form-input" placeholder="Enter your admin ID" required>
            </div>
            <button type="submit" class="primary-button">→ Access Dashboard</button>
        </form>
    </div>
</div>
{% endblock %}
